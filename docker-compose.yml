name: scholarseeker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarseeker}
      POSTGRES_USER: ${POSTGRES_USER:-scholarseeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarseeker_pg_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-scholarseeker} -d ${POSTGRES_DB:-scholarseeker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--loglevel",
        "warning",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-scholarseeker_neo4j_pass}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: scholarseeker-api/Dockerfile
      args:
        INSTALL_RERANKER: ${INSTALL_RERANKER:-false}
    restart: unless-stopped
    environment:
      SCHOLARSEEKER_CONFIG_PATH: /app/config.yaml
      SCHOLARSEEKER_DEBUG: ${SCHOLARSEEKER_DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-scholarseeker}
      POSTGRES_USER: ${POSTGRES_USER:-scholarseeker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarseeker_pg_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-scholarseeker_neo4j_pass}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      LLM_ACTIVE_PROVIDER: ${LLM_ACTIVE_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      CUSTOM_LLM_API_KEY: ${CUSTOM_LLM_API_KEY:-}
      CUSTOM_LLM_BASE_URL: ${CUSTOM_LLM_BASE_URL:-}
      CUSTOM_LLM_MODEL: ${CUSTOM_LLM_MODEL:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      CROSS_ENCODER_ENABLED: ${CROSS_ENCODER_ENABLED:-false}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-BAAI/bge-reranker-base}
      CROSS_ENCODER_DEVICE: ${CROSS_ENCODER_DEVICE:-cpu}
      HF_HOME: /models/huggingface
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: scholarseeker-web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  model_cache:
